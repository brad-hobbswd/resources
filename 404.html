<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Page Not Found | Resource Library</title>

<meta name="description" content="The requested resource could not be found. Return to the Bradley Hobbs Resource Library.">

<link rel="stylesheet" href="styles/resources.css">

<style>

.error-page {

    min-height:100vh;

    display:flex;

    align-items:center;

    justify-content:center;

    text-align:center;

    padding:2rem;

    background:
    linear-gradient(
    rgba(16,27,43,.95),
    rgba(16,27,43,.95)
    );

    color:white;

}


.error-container {

    max-width:700px;

}


.error-number {

    font-family:
    "Cormorant Garamond",
    serif;

    font-size:8rem;

    color:#c8a45d;

    line-height:1;

}


.error-container h1 {

    color:white;

    font-size:3rem;

    margin-bottom:1rem;

}


.error-container p {

    font-size:1.2rem;

    margin-bottom:2rem;

}


.error-button {

    display:inline-block;

    padding:1rem 2.5rem;

    background:#c8a45d;

    color:#101b2b;

    border-radius:50px;

    font-weight:700;

    transition:.3s;

}


.error-button:hover {

    transform:translateY(-5px);

}


.error-links {

    margin-top:3rem;

}


.error-links a {

    color:#c8a45d;

    margin:0 .5rem;

}


</style>

</head>


<body>


<main class="error-page">


<div class="error-container">


<div class="error-number">
404
</div>


<h1>
Resource Not Found
</h1>


<p>
The resource you are looking for may have moved,
changed, or no longer exists. Continue exploring
the Resource Library to discover faith, learning,
creativity, and stories.
</p>



<a href="index.html" class="error-button">
Return To Resource Library
</a>



<div class="error-links">

<a href="index.html#education">
Education
</a>

|

<a href="index.html#faith">
Faith
</a>

|

<a href="index.html#creative">
Creative
</a>

|

<a href="index.html#stories">
Stories
</a>


</div>



</div>


</main>


</body>

</html>
